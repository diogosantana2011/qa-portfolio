name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
      # The site reads this annotation (via the public API) to show "x/y passed" in the hero.
      - name: Publish test counts
        if: always()
        run: |
          node -e '
            const { stats: s } = require("./results.json");
            const total = s.expected + s.unexpected + s.flaky + s.skipped;
            console.log(`::notice title=smoke-results::${JSON.stringify({ passed: s.expected + s.flaky, failed: s.unexpected, total })}`);
          '
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
